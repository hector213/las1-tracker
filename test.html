<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LAS1-Tracker — Firestore Smoke Test</title>
<style>
  body { font-family: monospace; background: #0f172a; color: #e2e8f0; padding: 32px; max-width: 860px; margin: 0 auto; }
  h1 { color: #f97316; margin-bottom: 4px; }
  p.sub { color: #94a3b8; margin-top: 0; margin-bottom: 24px; }
  button { background: #f97316; color: #fff; border: none; border-radius: 8px; padding: 12px 28px;
           font-size: 1rem; font-weight: 700; cursor: pointer; }
  button:disabled { background: #475569; cursor: not-allowed; }
  #log { background: #1e293b; border-radius: 8px; padding: 16px; margin-top: 24px;
         min-height: 160px; max-height: 600px; overflow-y: auto; font-size: 0.82rem; line-height: 1.8; }
  .ok   { color: #4ade80; }
  .fail { color: #f87171; }
  .info { color: #38bdf8; }
  .head { color: #f97316; font-weight: bold; margin-top: 6px; display: block; }
  .skip { color: #94a3b8; }
  #summary { margin-top: 16px; font-size: 1.15rem; font-weight: 700; }
  .pass-all { color: #4ade80; }
  .has-fail  { color: #f87171; }
</style>
</head>
<body>
<h1>Firestore Smoke Test</h1>
<p class="sub">Reads key collections from Firestore and verifies data migrated correctly.</p>
<button id="btn" onclick="runTest()">Run Tests</button>
<div id="summary"></div>
<div id="log"><span class="skip">Ready.</span></div>

<script type="module">
import { initializeApp }                          from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword }    from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, getDocs,
         doc, getDoc }                            from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app  = initializeApp({
  apiKey:            "AIzaSyCMPDpzhZEWZjP9SptREKVSB4dmdhY5cpM",
  authDomain:        "las1-tracker.firebaseapp.com",
  projectId:         "las1-tracker",
  storageBucket:     "las1-tracker.firebasestorage.app",
  messagingSenderId: "366160549791",
  appId:             "1:366160549791:web:b586a196cb8bf864aa0faa"
});
const auth = getAuth(app);
const db   = getFirestore(app);

const logEl = document.getElementById('log');
let passes = 0, failures = 0;

function log(msg, cls = '') {
  logEl.innerHTML += `<span class="${cls}">${msg}</span><br>`;
  logEl.scrollTop = logEl.scrollHeight;
}
function pass(msg) { passes++;  log('  PASS  ' + msg, 'ok'); }
function fail(msg) { failures++; log('  FAIL  ' + msg, 'fail'); }

async function check(label, fn) {
  try { await fn(); }
  catch(e) { fail(`${label}: ${e.message}`); }
}

window.runTest = async function() {
  const btn = document.getElementById('btn');
  const summaryEl = document.getElementById('summary');
  btn.disabled = true;
  logEl.innerHTML = '';
  summaryEl.textContent = '';
  passes = 0; failures = 0;

  // Auth
  log('--- Auth ---', 'head');
  try {
    if (!auth.currentUser) {
      const email = prompt('Admin email:');
      const pw    = prompt('Password:');
      await signInWithEmailAndPassword(auth, email, pw);
    }
    pass(`Signed in as ${auth.currentUser.email}`);
  } catch(e) {
    fail('Sign-in failed: ' + e.message);
    btn.disabled = false;
    return;
  }

  // Associates
  log('--- Associates ---', 'head');
  await check('Read associates collection', async () => {
    const snap = await getDocs(collection(db, 'associates'));
    if (snap.empty) throw new Error('No associates found');
    pass(`${snap.size} associates in Firestore`);
    const sample = snap.docs[0].data();
    if (!sample.name) throw new Error('Missing name field');
    pass(`Sample: "${sample.name}" (${sample.role || 'no role'}, ${sample.status})`);
  });

  // Certs
  log('--- Certs ---', 'head');
  await check('Read certs collection', async () => {
    const snap = await getDocs(collection(db, 'certs'));
    if (snap.empty) throw new Error('No cert docs found');
    pass(`${snap.size} cert docs in Firestore`);
  });

  // Attendance subcollection
  log('--- Attendance ---', 'head');
  await check('Read attendance top-level', async () => {
    const snap = await getDocs(collection(db, 'attendance'));
    if (snap.empty) throw new Error('No attendance associate docs');
    pass(`${snap.size} associates have attendance records`);
    // Pick first associate and check entries subcollection
    const firstId = snap.docs[0].id;
    const entries = await getDocs(collection(db, 'attendance', firstId, 'entries'));
    pass(`Associate ${firstId}: ${entries.size} attendance entries in subcollection`);
    if (entries.size > 0) {
      const e = entries.docs[0].data();
      pass(`Sample entry — date: ${e.date}, type: ${e.type}`);
    }
  });

  // Notes
  log('--- Notes ---', 'head');
  await check('Read notes', async () => {
    const snap = await getDocs(collection(db, 'notes'));
    pass(`${snap.size} associates have notes`);
    if (!snap.empty) {
      const firstId = snap.docs[0].id;
      const entries = await getDocs(collection(db, 'notes', firstId, 'entries'));
      pass(`Associate ${firstId}: ${entries.size} note entries`);
    }
  });

  // Points log
  log('--- Points Log ---', 'head');
  await check('Read pointslog', async () => {
    const snap = await getDocs(collection(db, 'pointslog'));
    pass(`${snap.size} associates have points log`);
    if (!snap.empty) {
      const firstId = snap.docs[0].id;
      const entries = await getDocs(collection(db, 'pointslog', firstId, 'entries'));
      pass(`Associate ${firstId}: ${entries.size} points log entries`);
    }
  });

  // Settings
  log('--- Settings ---', 'head');
  await check('Read settings/tabs', async () => {
    const snap = await getDoc(doc(db, 'settings', 'tabs'));
    pass(snap.exists() ? 'settings/tabs exists' : 'settings/tabs not set (OK — uses defaults)');
  });

  // Users
  log('--- Users ---', 'head');
  await check('Read users', async () => {
    const snap = await getDocs(collection(db, 'users'));
    if (snap.empty) throw new Error('No user accounts found');
    pass(`${snap.size} user account(s) in Firestore`);
    const u = snap.docs.find(d => d.data().email === auth.currentUser.email);
    if (u) pass(`Your account found: role = ${u.data().role}`);
    else fail('Your user account not found in users collection');
  });

  // Summary
  const total = passes + failures;
  log('');
  const msg = `${passes}/${total} tests passed${failures > 0 ? ` — ${failures} FAILED` : ''}`;
  log(msg, failures === 0 ? 'ok' : 'fail');
  summaryEl.textContent = msg;
  summaryEl.className = failures === 0 ? 'pass-all' : 'has-fail';
  btn.disabled = false;
};
</script>
</body>
</html>
